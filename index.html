        // 全局变量 - 日历相关
        var currentCalendarDate = new Date();
        
        // 初始化日历
        function initCalendar() {
            renderCalendar(currentCalendarDate);
            showScheduleByDate(getTodayDate());
        }
        
        // 切换月份
        function changeMonth(direction) {
            currentCalendarDate.setMonth(currentCalendarDate.getMonth() + direction);
            renderCalendar(currentCalendarDate);
        }
        
        // 渲染日历
        function renderCalendar(date) {
            var year = date.getFullYear();
            var month = date.getMonth();
            
            // 更新当前月份显示
            getElement('current-month').textContent = year + '年' + (month + 1) + '月';
            
            var calendarContainer = getElement('calendar-container');
            if (!calendarContainer) return;
            
            // 获取当月第一天
            var firstDay = new Date(year, month, 1);
            // 获取当月最后一天
            var lastDay = new Date(year, month + 1, 0);
            // 获取当月第一天是星期几
            var startDay = firstDay.getDay();
            // 获取当月的天数
            var daysInMonth = lastDay.getDate();
            
            // 生成日历HTML
            var html = '<table style="width: 100%; border-collapse: collapse; font-size: 14px;">';
            
            // 星期标题
            var weekdays = ['日', '一', '二', '三', '四', '五', '六'];
            html += '<tr>';
            for (var i = 0; i < weekdays.length; i++) {
                html += '<th style="text-align: center; padding: 10px; border: 1px solid #e0e0e0; background-color: #f8f9fa;">' + weekdays[i] + '</th>';
            }
            html += '</tr>';
            
            // 日历格子
            var dayCount = 1;
            var rowCount = Math.ceil((startDay + daysInMonth) / 7);
            
            for (var i = 0; i < rowCount; i++) {
                html += '<tr>';
                for (var j = 0; j < 7; j++) {
                    if ((i === 0 && j < startDay) || dayCount > daysInMonth) {
                        // 空白格子
                        html += '<td style="height: 80px; padding: 5px; border: 1px solid #e0e0e0;"></td>';
                    } else {
                        var currentDate = year + '-' + (month + 1).toString().padStart(2, '0') + '-' + dayCount.toString().padStart(2, '0');
                        var schedules = getSchedulesByDate(currentDate);
                        var hasSchedule = schedules.length > 0;
                        var isToday = currentDate === getTodayDate();
                        
                        html += '<td style="height: 80px; padding: 5px; border: 1px solid #e0e0e0; vertical-align: top; cursor: pointer;' + 
                                (isToday ? ' background-color: #e3f2fd;' : '') + 
                                (hasSchedule ? ' background-color: #fff3cd;' : '') + '">' +
                                '<div style="font-weight: bold; margin-bottom: 3px;">' + dayCount + '</div>';
                        
                        // 显示排期客户
                        if (hasSchedule) {
                            var customerNames = [];
                            schedules.forEach(function(schedule) {
                                if (!customerNames.includes(schedule.customerName)) {
                                    customerNames.push(schedule.customerName);
                                }
                            });
                            html += '<div style="font-size: 12px; line-height: 1.2;">' + customerNames.slice(0, 2).join(', ') + (customerNames.length > 2 ? '...' : '') + '</div>';
                        }
                        
                        html += '<div style="display: none;">' + currentDate + '</div>' +
                                '</td>';
                        dayCount++;
                    }
                }
                html += '</tr>';
            }
            
            html += '</table>';
            calendarContainer.innerHTML = html;
            
            // 添加日期点击事件
            var calendarCells = calendarContainer.querySelectorAll('td');
            calendarCells.forEach(function(cell) {
                var dateEl = cell.querySelector('div:last-child');
                if (dateEl && dateEl.textContent) {
                    cell.addEventListener('click', function() {
                        var date = dateEl.textContent;
                        showScheduleByDate(date);
                    });
                }
            });
        }
        
        // 根据日期获取排期
        function getSchedulesByDate(date) {
            var scheduleList = JSON.parse(localStorage.getItem('scheduleList') || '[]');
            return scheduleList.filter(function(item) {
                return item.date === date;
            });
        }
        
        // 显示指定日期的排期
        function showScheduleByDate(date) {
            var schedules = getSchedulesByDate(date);
            var scheduleViewList = getElement('schedule-view-list');
            var selectedDateTitle = getElement('selected-date-title');
            
            if (!scheduleViewList || !selectedDateTitle) return;
            
            // 更新标题
            var dateObj = new Date(date);
            var year = dateObj.getFullYear();
            var month = dateObj.getMonth() + 1;
            var day = dateObj.getDate();
            selectedDateTitle.textContent = year + '年' + month + '月' + day + '日 排期客户';
            
            // 显示排期列表
            if (schedules.length === 0) {
                scheduleViewList.innerHTML = '<div class="empty-tip">暂无排期数据</div>';
                return;
            }
            
            var html = '';
            schedules.forEach(function(item) {
                // 格式化日期为中文格式
                var formattedDate = formatDateChinese(item.date);
                
                html += '<div class="list-item">' +
                        '<div class="list-item-info">' +
                        '<div><strong>' + item.customerName + '</strong>（' + item.customerPhone + '）</div>' +
                        '<div>' + formattedDate + ' ' + item.time + '</div>' +
                        '<div>项目：' + item.project + ' | 类型：' + (item.type === 'single' ? '单次' : '批量') + '</div>' +
                        '<div>状态：' + (item.status === 'completed' ? '<span style="color: #27ae60;">已完成</span>' : '<span style="color: #e74c3c;">未完成</span>') + '</div>' +
                        '</div>' +
                        '<div class="list-item-opt">' +
                        '<button class="opt-btn opt-btn-status" onclick="changeScheduleStatus(\'' + item.id + '\', \'' + item.status + '\')">' +
                        (item.status === 'completed' ? '标记未完成' : '标记已完成') +
                        '</button>' +
                        '<button class="opt-btn opt-btn-del" onclick="deleteSchedule(\'' + item.id + '\')">删除</button>' +
                        '</div>' +
                        '</div>';
            });
            
            scheduleViewList.innerHTML = html;
        }
        
        // 复制所有排期信息
        function copyAllSchedule() {
            try {
                var currentQuerySchedule = JSON.parse(localStorage.getItem('currentQuerySchedule') || '[]');
                
                if (currentQuerySchedule.length === 0) {
                    alert('暂无排期数据可复制！');
                    return;
                }
                
                // 构建复制文本
                var copyText = '📅 宫诚阁客户排期信息\n\n';
                
                // 按日期排序
                currentQuerySchedule.sort(function(a, b) {
                    if (a.date !== b.date) {
                        return a.date.localeCompare(b.date);
                    }
                    return a.time.localeCompare(b.time);
                });
                
                // 直接遍历排期信息，每条都显示完整日期
                for (var i = 0; i < currentQuerySchedule.length; i++) {
                    var item = currentQuerySchedule[i];
                    
                    // 格式化日期为中文格式
                    var formattedDate = formatDateChinese(item.date);
                    copyText += '📆 ' + formattedDate + '\n';
                    
                    // 添加排期信息
                    copyText += '👤 ' + item.customerName + '（' + item.customerPhone + '）\n';
                    copyText += '⏰ ' + item.time + ' | 📌 ' + item.project + '\n';
                    copyText += '📊 状态：' + (item.status === 'completed' ? '✅ 已完成' : '🔄 未完成') + '\n\n';
                }
                
                // 复制到剪贴板
                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(copyText).then(function() {
                        var copyTip = document.getElementById('copy-tip');
                        if (copyTip) {
                            copyTip.style.display = 'block';
                            setTimeout(function() { copyTip.style.display = 'none'; }, 3000);
                        }
                    }).catch(function() {
                        fallbackCopyTextToClipboard(copyText);
                    });
                } else {
                    fallbackCopyTextToClipboard(copyText);
                }
                
            } catch (e) {
                alert('复制排期信息失败，请手动复制！');
            }
        }

        // 复制降级方案
        function fallbackCopyTextToClipboard(text) {
            var textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.top = 0;
            textArea.style.left = 0;
            textArea.style.opacity = 0;
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                var copyTip = document.getElementById('copy-tip');
                if (copyTip) {
                    copyTip.style.display = 'block';
                    setTimeout(function() { copyTip.style.display = 'none'; }, 3000);
                }
            } catch (err) {
                console.error('复制失败:', err);
                alert('复制失败，请手动复制！');
            } finally {
                document.body.removeChild(textArea);
            }
        }

        // 复制选择排期信息
        function copySelectedSchedule() {
            try {
                var checkboxes = document.querySelectorAll('.schedule-checkbox:checked');
                var selectedIds = [];
                
                checkboxes.forEach(function(checkbox) {
                    selectedIds.push(checkbox.value);
                });
                
                if (selectedIds.length === 0) {
                    alert('请先选择要复制的排期！');
                    return;
                }
                
                var currentQuerySchedule = JSON.parse(localStorage.getItem('currentQuerySchedule') || '[]');
                var selectedSchedules = currentQuerySchedule.filter(function(item) {
                    return selectedIds.includes(item.id);
                });
                
                // 构建复制文本
                var copyText = '📅 宫诚阁客户排期信息\n\n';
                
                // 按日期排序
                selectedSchedules.sort(function(a, b) {
                    if (a.date !== b.date) {
                        return a.date.localeCompare(b.date);
                    }
                    return a.time.localeCompare(b.time);
                });
                
                // 直接遍历排期信息，每条都显示完整日期
                for (var i = 0; i < selectedSchedules.length; i++) {
                    var item = selectedSchedules[i];
                    
                    // 格式化日期为中文格式
                    var formattedDate = formatDateChinese(item.date);
                    copyText += '📆 ' + formattedDate + '\n';
                    
                    // 添加排期信息
                    copyText += '👤 ' + item.customerName + '（' + item.customerPhone + '）\n';
                    copyText += '⏰ ' + item.time + ' | 📌 ' + item.project + '\n';
                    copyText += '📊 状态：' + (item.status === 'completed' ? '✅ 已完成' : '🔄 未完成') + '\n\n';
                }
                
                // 复制到剪贴板
                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(copyText).then(function() {
                        var copyTip = document.getElementById('copy-tip');
                        if (copyTip) {
                            copyTip.style.display = 'block';
                            setTimeout(function() { copyTip.style.display = 'none'; }, 3000);
                        }
                    }).catch(function() {
                        fallbackCopyTextToClipboard(copyText);
                    });
                } else {
                    fallbackCopyTextToClipboard(copyText);
                }
                
            } catch (e) {
                
                alert('复制排期信息失败，请手动复制！');
            }
        }

        // 格式化日期为YYYY-MM-DD
        function formatDate(date) {
            var year = date.getFullYear();
            var month = date.getMonth() + 1;
            var day = date.getDate();
            
            // 手动补零
            if (month < 10) month = '0' + month;
            if (day < 10) day = '0' + day;
            
            return year + '-' + month + '-' + day;
        }

        // 日期缓存，避免重复计算农历信息
        var dateCache = {};
        
        // 格式化日期为中文格式，包含农历和星期
        function formatDateChinese(dateStr) {
            try {
                // 直接计算，不使用缓存
                var dateArr = dateStr.split('-');
                if (dateArr.length !== 3) {
                    return dateStr;
                }
                var year = parseInt(dateArr[0]);
                var month = parseInt(dateArr[1]);
                var day = parseInt(dateArr[2]);
                
                // 公历日期
                var chineseDate = year + '年' + month + '月' + day + '日';
                
                // 农历日期
                var lunarInfo = '';
                try {
                    // 使用农历转换算法
                    var lunarDate = solarToLunar(year, month, day);
                    if (lunarDate && lunarDate.lunarMonth && lunarDate.lunarDay) {
                        var lunarMonthStr = (lunarDate.isLeap ? '闰' : '') + lunarDate.lunarMonth;
                        var lunarDayStr = lunarDate.lunarDay;
                        
                        lunarInfo = '（' + lunarMonthStr + lunarDayStr + '）';
                    } else {
                        lunarInfo = '（农历）';
                    }
                } catch (e) {
                    lunarInfo = '（农历）';
                }
                
                // 检查是否为二十四节气
                var solarTerm = '';
                try {
                    solarTerm = getSolarTerm(year, month, day);
                } catch (e) {
                    solarTerm = '';
                }
                var weekOrTerm = '';
                
                if (solarTerm) {
                    // 如果是节气，显示节气名称
                    weekOrTerm = solarTerm;
                } else {
                    // 否则显示星期几
                    var weekDays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
                    try {
                        var date = new Date(dateStr);
                        var dayOfWeek = date.getDay();
                        if (dayOfWeek >= 0 && dayOfWeek < weekDays.length) {
                            weekOrTerm = weekDays[dayOfWeek];
                        } else {
                            weekOrTerm = '';
                        }
                    } catch (e) {
                        weekOrTerm = '';
                    }
                }
                
                var result = chineseDate + lunarInfo + weekOrTerm;
                return result;
            } catch (e) {
                return dateStr;
            }
        }
        


        // 判断是否是休息日
        function isRestDay(dateStr) {
            try {
                var date = new Date(dateStr);
                var dayOfWeek = date.getDay();
                
                // 检查是否是每周休息日
                var setting = JSON.parse(localStorage.getItem('systemSetting') || '{}');
                var restSet = setting.restSet || [0];
                for (var i = 0; i < restSet.length; i++) {
                    if (restSet[i] === dayOfWeek) {
                        return true;
                    }
                }
                
                // 检查是否是节假日
                var holidayList = JSON.parse(localStorage.getItem('holidayList') || '[]');
                for (var i = 0; i < holidayList.length; i++) {
                    if (holidayList[i].date === dateStr) {
                        return true;
                    }
                }
                return false;
            } catch (e) {
                console.error('判断休息日失败:', e);
                return false;
            }
        }
</script>
